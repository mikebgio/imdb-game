services:
  web:
    build: .
    container_name: "imdb_game-webserver"
    restart: on-failure
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "python3", "imdb_game/healthcheck.py" ]
      timeout: 30s
      interval: 10s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
  db:
    build: db/
    container_name: "imdb_game-postgres"
    env_file:
      - .env
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "--dbname=imdb", "--username=$POSTGRES_USER" ]
      timeout: 45s
      interval: 10s
      retries: 10
